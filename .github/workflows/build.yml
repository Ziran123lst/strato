# A workflow to verify the build on every push to the master branch
name: Build

on:
  push: 
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Gradle Cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle') }}-${{ hashFiles('app/**/*.xml') }}-${{ hashFiles('app/**/*.kt', 'app/**/*.java') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle') }}-${{ hashFiles('app/**/*.xml') }}-
            ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle') }}-
            ${{ runner.os }}-gradle-

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Ninja Build
        run: |
          sudo apt-get install -y ninja-build

      - name: Android Assemble
        run: ./gradlew --no-daemon --stacktrace --parallel --configure-on-demand assembleMainlineRelease

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: strato-apk
          path: app/build/outputs/apk/mainline/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK_FILE=$(ls app/build/outputs/apk/mainline/release/*.apk | head -n1)
          RELEASE_TAG="nightly"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_FILE" --clobber
            gh release edit "$RELEASE_TAG" \
              --notes "Automated build from commit ${{ github.sha }} (${{ github.run_number }})" \
              --target "${{ github.ref_name }}"
          else
            gh release create "$RELEASE_TAG" "$APK_FILE" \
              --title "Strato Nightly" \
              --notes "Automated build from commit ${{ github.sha }} (${{ github.run_number }})"
          fi
